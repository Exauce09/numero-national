services:
  db:
    image: postgres:16-alpine
    container_name: nic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nic_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-db-password}
      POSTGRES_DB: ${POSTGRES_DB:-nic_core}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nic_admin} -d ${POSTGRES_DB:-nic_core}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nic_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-Systeme National d Identite}
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      SECRET_KEY: ${SECRET_KEY:-change-me-generate-a-strong-random-secret}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-nic_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-db-password}
      POSTGRES_DB: ${POSTGRES_DB:-nic_core}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RUN_MIGRATIONS: "true"
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  postgres_data:
