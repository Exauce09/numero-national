name: flutter_recensement
description: Application terrain de recensement offline-first (Phase 3)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.4.1
  path: ^1.9.0
  connectivity_plus: ^6.1.0
  http: ^1.2.2
  geolocator: ^13.0.2
  uuid: ^4.5.1
  # camera: ^0.11.0+2  # uncomment when device photo capture is enabled
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo-rdc.jpg
