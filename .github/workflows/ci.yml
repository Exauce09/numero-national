name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5-alpine
        env:
          POSTGRES_USER: nic_admin
          POSTGRES_PASSWORD: ci-strong-db-password-16
          POSTGRES_DB: nic_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nic_admin -d nic_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: development
      APP_DEBUG: "true"
      SECRET_KEY: ci-test-secret-key-must-be-long-enough-32
      ALLOW_DEV_AUTH_HEADERS: "true"
      ALLOW_OPEN_REGISTRATION: "true"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: nic_admin
      POSTGRES_PASSWORD: ci-strong-db-password-16
      POSTGRES_DB: nic_core
      REDIS_URL: redis://localhost:6379/0
      PASSWORD_MIN_LENGTH: "12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run migrations
        run: alembic upgrade head

      - name: Pytest
        run: pytest -q --tb=short

      - name: OpenAPI smoke import
        run: python -c "from apps.api.main import app; assert '/health' in app.openapi()['paths']"
