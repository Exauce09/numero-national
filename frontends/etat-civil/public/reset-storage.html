<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Remise à zéro — état civil</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 36rem;
        margin: 3rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      .ok {
        color: #0a6;
      }
      code {
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <h1>Remise à zéro (navigateur)</h1>
    <p id="msg">Effacement en cours…</p>
    <script>
      (function () {
        var FRESH = "nn_fresh_install_v1";
        function run() {
          var before = localStorage.length;
          try {
            localStorage.clear();
          } catch (e) {}
          try {
            sessionStorage.clear();
          } catch (e) {}
          try {
            localStorage.setItem(FRESH, "1");
          } catch (e) {}
          var msg =
            '<span class="ok"><strong>' +
            before +
            "</strong> clé(s) supprimée(s) sur <code>" +
            location.host +
            "</code>.</span>" +
            "<br/>Les comptes démo ne seront pas recréés tant que vous n'allez pas sur <code>/setup</code>." +
            "<br/><br/>Si des données restent visibles : ouvrez cette même page sur chaque adresse utilisée " +
            "(<code>localhost</code>, <code>127.0.0.1</code>, IP réseau…) — le stockage est séparé par adresse." +
            "<br/><br/>Redirection…";
          document.getElementById("msg").innerHTML = msg;
          setTimeout(function () {
            location.replace("/setup");
          }, 3500);
        }
        if ("caches" in window) {
          caches
            .keys()
            .then(function (names) {
              return Promise.all(names.map(function (n) { return caches.delete(n); }));
            })
            .finally(run);
        } else {
          run();
        }
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          });
        }
      })();
    </script>
  </body>
</html>
