<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Remise à zéro — état civil</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 36rem;
        margin: 3rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      .ok {
        color: #0a6;
      }
      code {
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <h1>Remise à zéro (navigateur)</h1>
    <p id="msg">Effacement en cours…</p>
    <script>
      (function () {
        function run() {
          var before = localStorage.length;
          try {
            localStorage.clear();
          } catch (e) {}
          try {
            sessionStorage.clear();
          } catch (e) {}
          document.getElementById("msg").innerHTML =
            '<span class="ok"><strong>' +
            before +
            "</strong> clé(s) supprimée(s) sur <code>" +
            location.host +
            "</code>.</span><br/>Redirection…";
          setTimeout(function () {
            location.replace("/login");
          }, 2000);
        }
        if ("caches" in window) {
          caches
            .keys()
            .then(function (names) {
              return Promise.all(names.map(function (n) { return caches.delete(n); }));
            })
            .finally(run);
        } else {
          run();
        }
      })();
    </script>
  </body>
</html>
